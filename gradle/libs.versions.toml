[versions]
grpc = "1.85.1"
protobuf = "4.36.2"
junit = "5.14.4"

[libraries]
protobuf = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
annotationsapi = { module = "org.apache.tomcat:annotations-api", version = "6.0.53" }

grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version = "3.27.7" }

nexus-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version = "0.37.0" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version = "8.10.4" }
protobuf-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version = "0.10.0" }
